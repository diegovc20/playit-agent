# Compila el agente oficial de playit.gg para Mac con chip Apple y lo publica en un release de este
# fork. playit.gg dejó de publicar binarios para Mac después de la 0.15.13; Parabellum (un launcher de
# Minecraft) lo necesita para hostear servidores en Mac.
#
# Se dispara con una etiqueta "v<versión de playit>-macos-arm64" puesta sobre la etiqueta oficial de
# esa versión más este archivo (el código de playit no cambia). El workflow de playit
# (build-release.yml) se quitó en esta rama porque necesita sus secretos.
#
# La compilación corre código de terceros (los build.rs de las dependencias), así que lo hace un
# trabajo de solo lectura y sin el token guardado; otro trabajo, que no compila nada, publica.
#
# Builds the official playit.gg agent for Apple Silicon Macs from the upstream tag, unchanged.

name: Agente para Mac (arm64)

on:
  push:
    tags: ["v*-macos-arm64"]

permissions: {}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compilar
        run: |
          rustc --version | tee rustc.txt
          rustup target add aarch64-apple-darwin
          cargo build --release --locked -p playit-cli --target aarch64-apple-darwin

      - name: Comprobar
        run: |
          bin=target/aarch64-apple-darwin/release/playit-cli
          file "$bin"
          codesign -dv "$bin"
          version="$("$bin" version)"
          echo "versión: $version"
          test "v${version}-macos-arm64" = "$GITHUB_REF_NAME"
          mkdir salida
          cp "$bin" salida/playit-darwin-arm64
          cp LICENSE.txt rustc.txt salida/
          (cd salida && shasum -a 256 playit-darwin-arm64 | tee playit-darwin-arm64.sha256)
          stat -f "%z bytes" salida/playit-darwin-arm64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agente
          path: salida/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agente

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream="${GITHUB_REF_NAME%-macos-arm64}"
          cat > notas.md <<EOF
          Agente de playit.gg ${upstream} para Mac con chip Apple (arm64, macOS 11 o más nuevo), compilado
          por GitHub Actions a partir de la etiqueta oficial [${upstream}](https://github.com/playit-cloud/playit-agent/tree/${upstream})
          sin cambios en el código: \`cargo build --release --locked -p playit-cli --target aarch64-apple-darwin\`
          ($(cat rustc.txt)). Ver el workflow \`.github/workflows/macos-arm64.yml\` y su ejecución.

          Official playit.gg agent ${upstream} built for Apple Silicon Macs from the upstream tag, unchanged.

          SHA-256: \`$(cut -d' ' -f1 playit-darwin-arm64.sha256)\`

          Licencia: BSD-2-Clause, Copyright 2022 Developed Methods LLC (\`LICENSE.txt\`).
          EOF
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" playit-darwin-arm64 playit-darwin-arm64.sha256 LICENSE.txt \
            --title "playit ${upstream} para Mac (arm64)" --notes-file notas.md
